kind = "web"
previewPath = "/"
title = "Lexus Energy Quiz"
version = "1.0.0"
id = "artifacts/lexus-energy-quiz"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22615

[services.development]
run = "pnpm --filter @workspace/lexus-energy-quiz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lexus-energy-quiz", "run", "build" ]
publicDir = "artifacts/lexus-energy-quiz/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22615"
BASE_PATH = "/"
